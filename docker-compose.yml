
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: rits_db
      MYSQL_USER: rits
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dokploy-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - dokploy-network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  mysql_data:

networks:
  dokploy-network:
    external: true
